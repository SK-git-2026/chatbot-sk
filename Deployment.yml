apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot-sk
  labels:
    app: chatbot-sk
spec:
  replicas: 2
  selector:
    matchLabels:
      app: chatbot-sk
  template:
    metadata:
      labels:
        app: chatbot-sk
    spec:
      containers:
        - name: chatbot-sk
          image: skpatilhub/bot-sk-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8501
          resources:
            requests:
              cpu: "100m"
              memory: "200Mi"
  

---
apiVersion: v1
kind: Service
metadata:
  name: chatbot-sk-service
spec:
  type: LoadBalancer
  selector:
    app: chatbot-sk
  ports:
    - port: 80
      targetPort: 8501
      protocol: TCP
