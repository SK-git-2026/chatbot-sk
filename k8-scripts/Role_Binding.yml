apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-role-binding
  namespace: sk # The namespace where this binding applies
subjects:
- kind: ServiceAccount
  name: Jenkins # "name" is case sensitive
  namespace: sk
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role # Must be 'Role' or 'ClusterRole'
  name: app-role # Name of the Role or ClusterRole being bound
  apiGroup: rbac.authorization.k8s.io
